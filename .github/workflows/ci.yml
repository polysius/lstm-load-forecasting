name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: make lint

  test:
    name: unit + contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: pytest (includes slow model-training canaries and the registry flow)
        run: >-
          uv run --no-sync pytest -m "not integration" -q
          --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  container:
    name: container integration (arm64, like Lambda)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Build a smoke-test model bundle
        run: make smoke-bundle
      - name: Build the serving image
        run: >-
          docker build --provenance=false -f docker/Dockerfile.serve
          -t forecast-api:ci .
      - name: Start the container
        run: |
          docker run -d --name api -p 8080:8080 forecast-api:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/health && exit 0
            sleep 1
          done
          docker logs api; exit 1
      - name: Contract tests against the running container
        run: make test-integration FORECAST_API_URL=http://localhost:8080
      - name: Container logs
        if: failure()
        run: docker logs api
