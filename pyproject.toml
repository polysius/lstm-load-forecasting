[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lstm-load-forecasting"
version = "0.2.0"
description = "Leakage-audited load forecasting service: LSTM vs baselines, MLflow registry, ONNX serving, drift monitoring and retraining, run locally"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Raghunath Gurumoorthy" }]

# The core install is deliberately tiny: it is what the serving image needs
# besides the `serve` extra. Heavy training/monitoring stacks live in extras.
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
data = [
    # <3.1: evidently 0.7.23 imports pandas.core.dtypes.common.infer_dtype_from_object,
    # a private helper pandas 3.1 removed.
    "pandas>=2.2,<3.1",
    "pyarrow>=15",
    "requests>=2.31",
    "python-dotenv>=1.0",
]
train = [
    "lstm-load-forecasting[data]",
    "torch>=2.3",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "mlflow>=2.16",
    "onnx>=1.16",
    "onnxscript>=0.1",
    "onnxruntime>=1.18",
    "matplotlib>=3.8",
]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "onnxruntime>=1.18",
    "prometheus-client>=0.20",
    "boto3>=1.34",
]
monitor = [
    "lstm-load-forecasting[data]",
    "evidently>=0.6",
    "scipy>=1.12",
    "prometheus-client>=0.20",
]

[project.scripts]
forecast = "forecast.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "jsonschema>=4.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forecast"]

[tool.uv]
# Native Windows on ARM64 cannot install lightgbm/pyarrow wheels; use WSL2 there.
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: trains real models; deselect with -m 'not slow'",
    "integration: needs a running container (FORECAST_API_URL)",
]
filterwarnings = [
    "ignore::DeprecationWarning:mlflow.*",
]

[tool.coverage.run]
source = ["forecast"]
branch = true
