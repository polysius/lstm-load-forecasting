dataset:
  name: "ElectricityLoadDiagrams20112014"
  source_url: "https://archive.ics.uci.edu/static/public/321/electricityloaddiagrams20112014.zip"
  raw_filename: "LD2011_2014.txt"
  target_client: "MT_001"  # single client for simplicity; change to aggregate if needed

preprocessing:
  resample_freq: "1h"
  timezone: "Europe/Lisbon"
  interpolate_method: "linear"
  interpolate_max_gap_hours: 3  # gaps larger than this stay NaN

task:
  input_window: 168        # hours (one week)
  forecast_horizons: [1, 6, 24]
  mode: "direct_multi_horizon"

seasonal:
  primary_period: 24       # daily
  secondary_period: 168    # weekly
