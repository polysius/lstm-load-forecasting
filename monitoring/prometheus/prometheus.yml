global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: forecast-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  - job_name: pushgateway # monitoring-job metrics (drift, rolling error)
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
