# Local / homelab monitoring stack: the API container + Prometheus + Pushgateway +
# Grafana with a provisioned dashboard. `make monitoring-up`, then http://localhost:3000
# Serves artifacts/model and logs to var/predictions; `make drift-demo` points both at var/demo (monitoring/demo.env).
name: forecast-monitoring

services:
  api:
    image: lstm-forecast-serve:dev
    user: "0:0" # writes prediction logs to the bind mount below
    environment:
      MODEL_DIR: /models/current
      PREDICTION_LOG_URI: /var/predictions
    volumes:
      - ${SERVING_DIR:-../artifacts/model}:/models/current:ro
      - ${PREDICTIONS_DIR:-../var/predictions}:/var/predictions
    ports: ["8080:8080"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  pushgateway:
    image: prom/pushgateway:v1.11.5
    ports: ["9091:9091"]

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/forecast-service.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
